<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
          <h3>Registro de Usuario</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="nombre" name="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-success w-100" [disabled]="cargando">
              {{ cargando ? 'Registrando...' : 'Registrarse' }}
            </button>
            <div class="alert alert-danger mt-3" *ngIf="mensaje && mensaje.includes('❌')">
              {{ mensaje }}
            </div>
            <div class="alert alert-success mt-3" *ngIf="mensaje && mensaje.includes('✅')">
              {{ mensaje }}
            </div>
          </form>
          <hr>
          <p class="text-center mb-0">
            ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
