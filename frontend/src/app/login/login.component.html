<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h3>Iniciar Sesión</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input 
                type="email" 
                class="form-control" 
                [(ngModel)]="email" 
                name="email"
                autocomplete="off"
                required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input 
                type="password" 
                class="form-control" 
                [(ngModel)]="password" 
                name="password"
                required>
            </div>
            <button 
              type="submit" 
              class="btn btn-primary w-100" 
              [disabled]="cargando">
              {{ cargando ? 'Verificando...' : 'Ingresar' }}
            </button>
            
            <!-- Mensaje de error INMEDIATO -->
            <div class="alert alert-danger mt-3 text-center" *ngIf="mensajeError">
              {{ mensajeError }}
            </div>
          </form>
          <hr>
          <p class="text-center mb-0">
            ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
